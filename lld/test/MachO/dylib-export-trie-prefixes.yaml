# REQUIRES: x86
# RUN: rm -rf %t; split-file %s %t
# RUN: llvm-mc -filetype=obj -triple=x86_64-apple-macos %t/test.s -o %t/test.o
# RUN: yaml2obj %t/dylib.yaml -o %t/libtrie.dylib
# RUN: %lld -platform_version macos 12.0 12.0 -no_fixup_chains -lSystem %t/test.o %t/libtrie.dylib -o %t/test
# RUN: llvm-objdump --macho --lazy-bind %t/test | FileCheck %s --check-prefix=BINDS
# RUN: llvm-mc -filetype=obj -triple=x86_64-apple-macos %t/hidden.s -o %t/hidden.o
# RUN: not %lld -platform_version macos 12.0 12.0 -no_fixup_chains -lSystem %t/hidden.o %t/libtrie.dylib -o %t/hidden 2>&1 | FileCheck %s --check-prefix=HIDDEN

## The root has a terminal prefix, sibling edges, a long edge, and two edges
## with the same child offset. The latter is a valid shared child rather than
## a cycle because it is no longer in the active path when the second edge is
## visited.
# BINDS-DAG: _prefix{{$}}
# BINDS-DAG: _prefix_child{{$}}
# BINDS-DAG: _prefix_sibling{{$}}
# BINDS-DAG: _shared_one{{$}}
# BINDS-DAG: _shared_two{{$}}
# BINDS-DAG: _aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa{{$}}
# HIDDEN: error: undefined symbol: _hidden

#--- test.s
.globl _main
_main:
  callq _prefix
  callq _prefix_child
  callq _prefix_sibling
  callq _shared_one
  callq _shared_two
  callq _aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  retq

#--- hidden.s
.globl _main
_main:
  callq _hidden
  retq

